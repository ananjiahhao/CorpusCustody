<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: records passing a gate. Slate lifted to #cbd5e1 is the ink on
  #0d1117 for the wordmark body and the record and verdict outlines. The single
  accent, amber lifted to #e0a458, is the gate itself and the blocking verdict,
  the decision point. Two colours plus neutrals only, matching the logo and the
  obligation matrix. Contrast on #0d1117: ink 13.4:1, amber 9.1:1, muted 6.3:1.
  Grid: every edge and baseline on a multiple of 4. No glow, no blur, no
  gradients as decoration. Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img"
     aria-labelledby="bannerTitle bannerDesc" width="1400" height="360">
  <title id="bannerTitle">CorpusCustody banner</title>
  <desc id="bannerDesc">CorpusCustody, an offline license and provenance gate.
    Three record blocks pass through a gate bar to verdicts: pass, hold, and
    block.</desc>

  <rect x="0" y="0" width="1400" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="64" y="84" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700"><tspan fill="#cbd5e1">corpus</tspan><tspan fill="#e0a458">custody</tspan></text>
  <text x="64" y="130" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3">Offline license and provenance gate for training data</text>
  <text x="64" y="158" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">SPDX classes. Obligation matrix. Deterministic verdicts.</text>

  <text x="1090" y="84" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">v1.0.3</text>
  <text x="1180" y="84" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">MIT</text>
  <text x="1240" y="84" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">Python 3.11+</text>

  <line x1="64" y1="188" x2="1336" y2="188" stroke="#30363d" stroke-width="1"/>

  <rect x="96" y="208" width="120" height="32" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="156" y="229" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#e6edf3">MIT</text>

  <rect x="96" y="256" width="120" height="32" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="156" y="277" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#e6edf3">GPL-3.0</text>

  <rect x="96" y="304" width="120" height="32" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="156" y="325" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#e6edf3">unknown</text>

  <line x1="216" y1="224" x2="448" y2="224" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="216" y1="272" x2="448" y2="272" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="216" y1="320" x2="448" y2="320" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="448" y="196" width="12" height="56" rx="3" fill="#e0a458"/>
  <rect x="448" y="268" width="12" height="64" rx="3" fill="#e0a458"/>
  <text x="454" y="188" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="14" fill="#8b949e">gate</text>

  <line x1="460" y1="224" x2="700" y2="224" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="460" y1="272" x2="700" y2="272" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="460" y1="320" x2="700" y2="320" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="700" y="208" width="120" height="32" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="760" y="229" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#e6edf3">pass</text>

  <rect x="700" y="256" width="120" height="32" rx="6" fill="none" stroke="#e0a458" stroke-width="1.5"/>
  <text x="760" y="277" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#e0a458">hold</text>

  <rect x="700" y="304" width="120" height="32" rx="6" fill="#e0a458"/>
  <text x="760" y="325" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#0d1117">block</text>

  <text x="864" y="229" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">attribution only</text>
  <text x="864" y="277" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">share-alike propagates</text>
  <text x="864" y="325" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">unknown class, review required</text>
</svg>
